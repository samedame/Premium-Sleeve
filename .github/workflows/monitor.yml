name: monitor

on:
  schedule:
    # Same reasoning as entry.yml: fire hourly and let src/schedule_guard.py
    # decide. Monitor is limited to two runs per ET date, at least 3 hours
    # apart, inside 09:45-15:55 ET, because each run advances the
    # kill-switch restart clock.
    - cron: "10 14-20 * * 1-5"
  workflow_dispatch:           # open-scheduler fires this
    inputs:
      scheduled_for_et:
        description: "Intended fire time (ET, ISO-8601). Set by open-scheduler (ignored by the bot)."
        required: false
        default: ""
      trigger:
        description: "Who started this run (cf-scheduler | test | manual)"
        required: false
        default: "manual"

permissions:
  contents: write

concurrency:
  group: premium-sleeve-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schedule guard
        run: python3 -m src.schedule_guard check monitor --event "${{ github.event_name }}"

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt
        if: env.SKIP != '1'

      - name: Log capital source
        env:
          CAPITAL_VAR: ${{ vars.ACCOUNT_CAPITAL_FOR_SIZING }}
        run: |
          if [ -n "$CAPITAL_VAR" ]; then echo "capital=$CAPITAL_VAR source=repo-variable"; else echo "capital=1500 source=default"; fi
      - name: Run monitor
        if: env.SKIP != '1'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Tradier first; without these two the bot falls back to yfinance and labels every alert DELAYED/UNVERIFIED.
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          ACCOUNT_CAPITAL_FOR_SIZING: ${{ vars.ACCOUNT_CAPITAL_FOR_SIZING || '1500' }}   # default 1500; a repo variable overrides it
          ASSUME_FILLED: ${{ vars.ASSUME_FILLED }}
        run: python -m src.monitor

      - name: Record run
        if: env.SKIP != '1'
        run: python -m src.schedule_guard record monitor

      - name: Commit state
        if: env.SKIP != '1'
        run: |
          git config user.name  "premium-sleeve"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "monitor: state update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      # A job that crashes posts nothing, and "no alert" looks exactly like "no signal". Best effort, never fails the run.
      - name: Tell Discord if this run failed
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify_failure.py "Premium Sleeve monitor"
