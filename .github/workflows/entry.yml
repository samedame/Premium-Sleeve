name: entry

# One trigger: the Cloudflare `open-scheduler` Worker dispatches this at 15:40 ET.
# The hourly GitHub cron that used to sit behind it ("40 14-20 * * 1-5") was removed on 2026-11-13. GitHub starts
# scheduled runs hours late on this repo, so it could not be timed: a run that happened to land inside the entry
# window before 15:40 did the day's scan early and the Worker's dispatch then ran a second one, and every other
# run was a billed no-op. If the Worker fails, its own "did not start" alert fires.
# To restore a GitHub-side trigger, add under `on:`:
#   schedule:
#     - cron: "40 14-20 * * 1-5"   # hourly; src/schedule_guard.py lets through the first run inside 12:00-15:55 ET
on:
  workflow_dispatch:           # open-scheduler fires this
    inputs:
      scheduled_for_et:
        description: "Intended fire time (ET, ISO-8601). Set by open-scheduler (ignored by the bot)."
        required: false
        default: ""
      trigger:
        description: "Who started this run (cf-scheduler | test | manual)"
        required: false
        default: "manual"

permissions:
  contents: write

concurrency:
  group: premium-sleeve-state
  cancel-in-progress: false

jobs:
  entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schedule guard
        run: python3 -m src.schedule_guard check entry --event "${{ github.event_name }}"

      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt
        if: env.SKIP != '1'

      - name: Log capital source
        env:
          CAPITAL_VAR: ${{ vars.ACCOUNT_CAPITAL_FOR_SIZING }}
        run: |
          if [ -n "$CAPITAL_VAR" ]; then echo "capital=$CAPITAL_VAR source=repo-variable"; else echo "capital=1500 source=default"; fi
      - name: Run entry scan
        if: env.SKIP != '1'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Tradier first; without these two the bot falls back to yfinance and labels every alert DELAYED/UNVERIFIED.
          TRADIER_API_KEY: ${{ secrets.TRADIER_API_KEY }}
          TRADIER_BASE_URL: ${{ secrets.TRADIER_BASE_URL }}
          ACCOUNT_CAPITAL_FOR_SIZING: ${{ vars.ACCOUNT_CAPITAL_FOR_SIZING || '1500' }}   # default 1500; a repo variable overrides it
          ASSUME_FILLED: ${{ vars.ASSUME_FILLED }}
        run: python -m src.entry

      # Only reached when the scan finished without a data error, so a
      # throttled run is retried by the next hourly slot.
      - name: Record run
        if: env.SKIP != '1'
        run: python -m src.schedule_guard record entry

      - name: Commit state
        if: env.SKIP != '1'
        run: |
          git config user.name  "premium-sleeve"
          git config user.email "bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "entry: state update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      # A job that crashes posts nothing, and "no alert" looks exactly like "no signal". Best effort, never fails the run.
      - name: Tell Discord if this run failed
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python notify_failure.py "Premium Sleeve entry"
